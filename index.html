<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Business Card</title>

    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #status-badge {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 15, 15, 0.95);
        color: #d4af37;
        padding: 10px 22px;
        border-radius: 25px;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: 600;
        border: 1.5px solid rgba(212, 175, 55, 0.8);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        z-index: 9999;
        pointer-events: none;
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body>

    <div id="status-badge">Scan Business Card</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- Camera -->
      <a-camera 
        id="main-camera" 
        position="0 0 0" 
        look-controls="enabled: false" 
        cursor="fuse: false; rayOrigin: mouse" 
        raycaster="far: 10000; objects: .clickable">
        
        <!-- AR CONTENT -->
        <a-entity id="ar-content" position="0 0 -1.0" scale="0.8 0.8 0.8" visible="false">
          
          <!-- Base Frame -->
          <a-plane position="0 0 0" height="0.6" width="0.9" material="color: #0f172a; opacity: 0.95; metalness: 0.5"></a-plane>

          <!-- Gold Border Line -->
          <a-plane position="0 0 -0.005" height="0.63" width="0.93" material="color: #D4AF37"></a-plane>

          <!-- Header Title -->
          <a-text value="SELECT PLATFORM" color="#FFD700" align="center" position="0 0.18 0.05" scale="0.4 0.4 0.4"></a-text>

          <!-- TIKTOK BUTTON -->
          <a-plane 
            id="tiktok-btn" 
            class="clickable" 
            color="#000000" 
            position="-0.22 -0.05 0.08" 
            height="0.22" 
            width="0.38" 
            material="shader: flat; opacity: 1">
            <a-plane position="0 0 -0.001" height="0.24" width="0.4" color="#00f2fe"></a-plane>
            <a-text value="TikTok" color="#00f2fe" align="center" position="0 0 0.02" scale="0.38 0.38 0.38"></a-text>
          </a-plane>

          <!-- INSTAGRAM BUTTON -->
          <a-plane 
            id="insta-btn" 
            class="clickable" 
            color="#E1306C" 
            position="0.22 -0.05 0.08" 
            height="0.22" 
            width="0.38" 
            material="shader: flat; opacity: 1">
            <a-plane position="0 0 -0.001" height="0.24" width="0.4" color="#FFFFFF"></a-plane>
            <a-text value="Instagram" color="#FFFFFF" align="center" position="0 0 0.02" scale="0.38 0.38 0.38"></a-text>
          </a-plane>

        </a-entity>
      </a-camera>

      <!-- Target Reference -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
      const targetEl = document.querySelector('#card-target');
      const contentEl = document.querySelector('#ar-content');
      const cameraEl = document.querySelector('#main-camera');
      const statusBadge = document.querySelector('#status-badge');

      let isTracking = false;
      const tempVector = new THREE.Vector3();
      const tempQuaternion = new THREE.Quaternion();
      const tempScale = new THREE.Vector3();

      function updateARPosition() {
        if (isTracking) {
          targetEl.object3D.matrixWorld.decompose(tempVector, tempQuaternion, tempScale);
          cameraEl.object3D.worldToLocal(tempVector);
          
          contentEl.object3D.position.copy(tempVector);
          contentEl.object3D.quaternion.copy(tempQuaternion);
          contentEl.object3D.quaternion.premultiply(cameraEl.object3D.quaternion.clone().invert());
          
          requestAnimationFrame(updateARPosition);
        }
      }

      targetEl.addEventListener('targetFound', () => {
        isTracking = true;
        contentEl.setAttribute('visible', 'true');
        
        statusBadge.innerText = "✨ Linked to Card";
        statusBadge.style.color = "#4ade80";
        statusBadge.style.borderColor = "#4ade80";

        updateARPosition();
      });

      targetEl.addEventListener('targetLost', () => {
        isTracking = false;

        statusBadge.innerText = "📱 Screen View Mode";
        statusBadge.style.color = "#FFD700";
        statusBadge.style.borderColor = "#FFD700";

        contentEl.object3D.position.set(0, 0, -1.0);
        contentEl.object3D.quaternion.set(0, 0, 0, 1);
        contentEl.object3D.scale.set(0.8, 0.8, 0.8);
      });

      // Updated Click Actions with Your Handles
      document.querySelector('#tiktok-btn').addEventListener('click', () => {
        window.location.href = 'https://www.tiktok.com/@cold_spice_18';
      });

      document.querySelector('#insta-btn').addEventListener('click', () => {
        window.location.href = 'https://www.instagram.com/abdelhak_kini/';
      });
    </script>
  </body>
</html>
