<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Abdelhak Kini | Digital Card</title>

    <!-- Three.js for Animated 3D Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #08080a; color: #ffffff; }

      /* 3D Canvas Background */
      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      /* Container */
      .container {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* Glassmorphism Profile Card */
      .card {
        width: 100%;
        max-width: 380px;
        background: rgba(18, 18, 22, 0.75);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 28px;
        padding: 36px 24px;
        text-align: center;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 1px rgba(255, 255, 255, 0.1);
        animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes cardAppear {
        from { opacity: 0; transform: translateY(30px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Avatar Ring */
      .avatar-wrapper {
        position: relative;
        width: 90px;
        height: 90px;
        margin: 0 auto 20px auto;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, #d4af37, #ffd700, #b8860b);
        box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
      }

      .avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
        color: #d4af37;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 6px;
        color: #ffffff;
      }

      .title {
        color: #d4af37;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
        margin-bottom: 28px;
      }

      /* Social Links Stack */
      .links-container {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 16px;
        border-radius: 16px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.3px;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      }

      .btn:active {
        transform: scale(0.96);
      }

      .btn-tiktok {
        background: #000000;
        color: #00f2fe;
        border: 1px solid rgba(0, 242, 254, 0.5);
        box-shadow: 0 4px 20px rgba(0, 242, 254, 0.15);
      }

      .btn-insta {
        background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        color: #ffffff;
        box-shadow: 0 4px 20px rgba(220, 39, 67, 0.25);
      }

      .footer-note {
        margin-top: 28px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 1px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>

    <!-- 3D Animated Particle Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="container">
      <div class="card">
        
        <div class="avatar-wrapper">
          <div class="avatar">AK</div>
        </div>

        <h1>ABDELHAK KINI</h1>
        <div class="title">Digital Creator</div>

        <div class="links-container">
          <a href="https://www.tiktok.com/@cold_spice_18" target="_blank" class="btn btn-tiktok">
            TikTok Profile
          </a>

          <a href="https://www.instagram.com/abdelhak_kini/" target="_blank" class="btn btn-insta">
            Instagram Profile
          </a>
        </div>

        <div class="footer-note">Scan & Connect</div>
      </div>
    </div>

    <!-- Background 3D Animation Script -->
    <script>
      const canvas = document.querySelector('#bg-canvas');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Create Floating 3D Gold Particles
      const particleCount = 150;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i++) {
        positions[i] = (Math.random() - 0.5) * 10;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const material = new THREE.PointsMaterial({
        size: 0.03,
        color: 0xd4af37,
        transparent: true,
        opacity: 0.8
      });

      const particleSystem = new THREE.Points(geometry, material);
      scene.add(particleSystem);

      camera.position.z = 3;

      // Subtle Animation Loop
      function animate() {
        requestAnimationFrame(animate);
        particleSystem.rotation.y += 0.0015;
        particleSystem.rotation.x += 0.0008;
        renderer.render(scene, camera);
      }
      animate();

      // Handle Screen Resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
