<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Business Card</title>

    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #status-badge {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 15, 15, 0.9);
        color: #d4af37;
        padding: 8px 18px;
        border-radius: 25px;
        font-family: sans-serif;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid rgba(212, 175, 55, 0.5);
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        z-index: 9999;
        pointer-events: none;
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body>

    <div id="status-badge">Scan Business Card</div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- Camera with AR Content natively nested inside -->
      <a-camera 
        id="main-camera" 
        position="0 0 0" 
        look-controls="enabled: false" 
        cursor="fuse: false; rayOrigin: mouse" 
        raycaster="far: 10000; objects: .clickable">
        
        <!-- AR CONTENT (Lives inside camera so it never disappears) -->
        <a-entity id="ar-content" position="0 0 -1.2" visible="false">
          
          <!-- Base Card Plane -->
          <a-plane position="0 0 0" height="0.65" width="1.0" material="color: #111111; metalness: 0.8; opacity: 0.95"></a-plane>

          <!-- Gold Border Frame -->
          <a-plane position="0 0 -0.001" height="0.68" width="1.03" material="color: #D4AF37; metalness: 1.0"></a-plane>

          <!-- Header Text -->
          <a-text value="CONNECT WITH ME" color="#D4AF37" align="center" position="0 0.18 0.02" scale="0.38 0.38 0.38"></a-text>

          <!-- TikTok Button -->
          <a-plane id="tiktok-btn" class="clickable" color="#000000" position="-0.24 -0.05 0.03" height="0.18" width="0.4">
            <a-text value="TikTok" color="#00f2fe" align="center" position="0 0 0.01" scale="0.32 0.32 0.32"></a-text>
          </a-plane>

          <!-- Instagram Button -->
          <a-plane id="insta-btn" class="clickable" color="#1a1a1a" position="0.24 -0.05 0.03" height="0.18" width="0.4">
            <a-text value="Instagram" color="#E1306C" align="center" position="0 0 0.01" scale="0.32 0.32 0.32"></a-text>
          </a-plane>

        </a-entity>
      </a-camera>

      <!-- Target Reference Anchor -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
      const targetEl = document.querySelector('#card-target');
      const contentEl = document.querySelector('#ar-content');
      const cameraEl = document.querySelector('#main-camera');
      const statusBadge = document.querySelector('#status-badge');

      let isTracking = false;
      const tempVector = new THREE.Vector3();
      const tempQuaternion = new THREE.Quaternion();
      const tempScale = new THREE.Vector3();

      function updateARPosition() {
        if (isTracking) {
          // Decompose target's world matrix
          targetEl.object3D.matrixWorld.decompose(tempVector, tempQuaternion, tempScale);
          
          // Convert world coordinates to camera local space
          cameraEl.object3D.worldToLocal(tempVector);
          
          // Apply transform relative to camera
          contentEl.object3D.position.copy(tempVector);
          contentEl.object3D.quaternion.copy(tempQuaternion);
          contentEl.object3D.quaternion.premultiply(cameraEl.object3D.quaternion.clone().invert());
          
          requestAnimationFrame(updateARPosition);
        }
      }

      // 1. CARD FOUND: Lock 3D buttons to physical card position
      targetEl.addEventListener('targetFound', () => {
        isTracking = true;
        contentEl.setAttribute('visible', 'true');
        
        statusBadge.innerText = "✨ Linked to Card";
        statusBadge.style.color = "#4ade80";
        statusBadge.style.borderColor = "#4ade80";

        updateARPosition();
      });

      // 2. CARD LOST: Smoothly dock 3D buttons in center of phone screen
      targetEl.addEventListener('targetLost', () => {
        isTracking = false;

        statusBadge.innerText = "📱 Screen View Mode";
        statusBadge.style.color = "#d4af37";
        statusBadge.style.borderColor = "#d4af37";

        // Reset to default screen position directly in front of lens
        contentEl.object3D.position.set(0, 0, -1.2);
        contentEl.object3D.quaternion.set(0, 0, 0, 1);
        contentEl.object3D.scale.set(1, 1, 1);
      });

      // Button Tap Redirection
      document.querySelector('#tiktok-btn').addEventListener('click', () => {
        window.location.href = 'https://www.tiktok.com/@your_handle';
      });

      document.querySelector('#insta-btn').addEventListener('click', () => {
        window.location.href = 'https://www.instagram.com/your_handle';
      });
    </script>
  </body>
</html>
