<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR Business Card</title>

    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: #000; }

      /* Status Badge */
      #status-badge {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.85);
        color: #d4af37;
        padding: 8px 20px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        border: 1px solid rgba(212, 175, 55, 0.4);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        z-index: 9999;
        pointer-events: none;
        transition: all 0.4s ease;
      }

      /* Ultra-Smooth HTML Pop-up GUI */
      #ar-gui {
        position: fixed;
        bottom: 0;
        left: 50%;
        width: 90%;
        max-width: 380px;
        background: rgba(15, 15, 15, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-bottom: none;
        border-radius: 24px 24px 0 0;
        padding: 24px 20px 32px 20px;
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
        z-index: 9998;
        
        /* Smooth Entrance Physics */
        transform: translate(-50%, 100%);
        opacity: 0;
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      }

      /* Active state on scan */
      #ar-gui.active {
        transform: translate(-50%, 0%);
        opacity: 1;
      }

      /* Subtle drag handle indicator at top of card */
      .card-handle {
        width: 36px;
        height: 4px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        margin: 0 auto 16px auto;
      }

      #ar-gui h2 {
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 4px;
        letter-spacing: 0.5px;
        text-align: center;
      }

      #ar-gui p {
        color: #d4af37;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 20px;
        text-align: center;
      }

      .btn-container {
        display: flex;
        gap: 12px;
      }

      .social-btn {
        flex: 1;
        padding: 14px 10px;
        border-radius: 14px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      }

      .social-btn:active {
        transform: scale(0.94);
      }

      .btn-tiktok {
        background: #000000;
        color: #00f2fe;
        border: 1px solid rgba(0, 242, 254, 0.6);
        box-shadow: 0 4px 20px rgba(0, 242, 254, 0.15);
      }

      .btn-insta {
        background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        color: #ffffff;
        border: none;
        box-shadow: 0 4px 20px rgba(220, 39, 67, 0.25);
      }
    </style>
  </head>
  <body>

    <!-- Top Status Indicator -->
    <div id="status-badge">Scan Business Card</div>

    <!-- On-Screen HTML Overlay -->
    <div id="ar-gui">
      <div class="card-handle"></div>
      <h2>ABDELHAK KINI</h2>
      <p>Connect On Socials</p>
      <div class="btn-container">
        <a href="https://www.tiktok.com/@cold_spice_18" target="_blank" class="social-btn btn-tiktok">
          TikTok
        </a>
        <a href="https://www.instagram.com/abdelhak_kini/" target="_blank" class="social-btn btn-insta">
          Instagram
        </a>
      </div>
    </div>

    <!-- Clean MindAR Scene without 3D Boxes -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target Anchor (Pure reference, no 3D elements inside) -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
      const targetEl = document.querySelector('#card-target');
      const statusBadge = document.querySelector('#status-badge');
      const arGui = document.querySelector('#ar-gui');

      // CARD FOUND: Slide up the glassmorphism popup smoothly
      targetEl.addEventListener('targetFound', () => {
        statusBadge.innerText = "✨ Card Recognized";
        statusBadge.style.color = "#4ade80";
        statusBadge.style.borderColor = "#4ade80";
        
        arGui.classList.add('active');
      });

      // CARD LOST: Keep popup on screen so user can tap links comfortably
      targetEl.addEventListener('targetLost', () => {
        statusBadge.innerText = "📱 Screen Mode (Active)";
        statusBadge.style.color = "#d4af37";
        statusBadge.style.borderColor = "#d4af37";
      });
    </script>
  </body>
</html>
